<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W2G - بث مباشر وأفلام ومسلسلات</title>
<link rel="icon" href="../img/favicon-32.png" type="image/png" sizes="32x32"><link rel="icon" href="../img/favicon.ico"><link rel="apple-touch-icon" href="../img/favicon-180.png">
<link rel="stylesheet" href="../one.css">
<link rel="stylesheet" href="main.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
<script src="../one.js"></script>
</head>
<body>
<aside class="side">
<a class="side-brand" href="main.html"><img src="../img/logo.png" alt="W2G"><div><div class="brand-name">W<span>2</span>G</div><small>We Watch Together</small></div></a>
<nav class="side-nav">
<button class="nav-i active" data-nav="home"><i class="ico ico-home"></i><span>الرئيسية</span></button>
<button class="nav-i" data-nav="live"><i class="ico ico-live"></i><span>البث المباشر</span></button>
<button class="nav-i" data-nav="movies"><i class="ico ico-play"></i><span>أفلام</span></button>
<button class="nav-i" data-nav="series"><i class="ico ico-room"></i><span>مسلسلات</span></button>
<button class="nav-i" data-c="fav"><i class="ico ico-heart"></i><span>المفضلة</span></button>
<button class="nav-i" data-nav="recent"><i class="ico ico-history"></i><span>شوفتها قريب</span></button>
<button class="nav-i soon" disabled><i class="ico ico-room"></i><span>غرفي</span><em>قريبا</em></button>
<button class="nav-i soon" disabled><i class="ico ico-users"></i><span>الأصدقاء</span><em>قريبا</em></button>
</nav>
<div class="side-foot">
<button class="theme-btn wide" type="button" aria-label="تغيير الوضع"></button>
<div class="side-user"><span class="avatar" id="avatar"></span><div><strong id="userName"></strong><small>متصل</small></div><button id="logout" class="icon-btn" title="خروج" aria-label="خروج"><i class="ico ico-logout"></i></button></div>
</div>
</aside>
<div class="shell">
<header class="top">
<a class="brand m-brand" href="main.html"><img src="../img/logo.png" alt="W2G"><div class="brand-name">W<span>2</span>G</div></a>
<div class="search"><i class="ico ico-search"></i><input id="search" type="search" placeholder="دور على قناة أو فيلم أو مسلسل..." aria-label="بحث"></div>
<button class="theme-btn m-only" type="button" aria-label="تغيير الوضع"></button>
</header>
<main class="wrap">
<section class="stage">
<div id="player"></div>
<aside class="now">
<span class="now-label">بيتعرض دلوقتي</span>
<div class="now-ch"><img id="nowLogo" alt=""><div><h2 id="nowName">مفيش قناة شغالة</h2><p id="nowCat"></p></div></div>
<button id="favBtn" class="btn btn-ghost" disabled>أضف للمفضلة</button>
<div class="recent"><h3>شوفتها قريب</h3><div id="recent" class="recent-list"></div></div>
</aside>
</section>
<div id="vodCtl" class="vod-ctl" hidden></div>
<nav id="sources" class="chips"></nav>
<nav id="cats" class="tabs-bar"></nav>
<section id="content" class="content"></section>
<section id="vod" class="content" hidden></section>
</main>
</div>
<nav class="bottom-nav">
<button class="active" data-nav="home"><i class="ico ico-home"></i><span>الرئيسية</span></button>
<button data-nav="live"><i class="ico ico-live"></i><span>مباشر</span></button>
<button data-nav="movies"><i class="ico ico-play"></i><span>أفلام</span></button>
<button data-nav="series"><i class="ico ico-room"></i><span>مسلسلات</span></button>
<button data-c="fav"><i class="ico ico-heart"></i><span>المفضلة</span></button>
<button data-nav="recent"><i class="ico ico-history"></i><span>قريب</span></button>
</nav>
<script src="../core/channels.js"></script>
<script src="../core/playlist.js"></script>
<script src="../core/player.js"></script>
<script src="../core/catalog.js"></script>
<script src="../core/vod.js"></script>
<script src="main.js"></script>
</body>
</html>
