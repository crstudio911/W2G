<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W2G - أفلام ومسلسلات</title>
<link rel="icon" href="../img/favicon-32.png" type="image/png" sizes="32x32"><link rel="icon" href="../img/favicon.ico"><link rel="apple-touch-icon" href="../img/favicon-180.png">
<link rel="stylesheet" href="../one.css">
<link rel="stylesheet" href="app.css">
<script src="../config.js"></script>
<script src="../one.js"></script>
</head>
<body>
<header class="topbar app-top">
<a class="brand" href="../index.html"><img src="../img/logo.png" alt="W2G"><div><div class="brand-name">W<span>2</span>G</div></div></a>
<nav class="tabs" id="sites"><button data-site="tmdb">TMDB</button><button data-site="lb">Letterboxd</button></nav>
<div class="top-act"><button class="theme-btn"></button></div>
</header>
<main id="view">
<section class="pick" id="pick">
<h1>اختار الموقع اللي هتدوّر فيه</h1>
<p>دوّر على الفيلم أو المسلسل، افتح صفحته، وهيظهرلك زرار «شغّل».</p>
<div class="pick-grid">
<button class="pick-card" data-site="tmdb"><strong>TMDB</strong><span>أكبر قاعدة أفلام ومسلسلات</span></button>
<button class="pick-card" data-site="lb"><strong>Letterboxd</strong><span>أفلام وتقييمات</span></button>
</div>
</section>
<div class="browser" id="browser" hidden><iframe id="site" title="موقع الأفلام" referrerpolicy="no-referrer"></iframe></div>
</main>
<div class="fab-wrap" id="fab" hidden>
<div class="fab-ep" id="ep" hidden><label>الموسم<input id="dS" type="number" min="1" value="1"></label><label>الحلقة<input id="dE" type="number" min="1" value="1"></label></div>
<button class="fab" id="playBtn"><i class="ico ico-play"></i><span>شغّل</span></button>
</div>
<div class="modal" id="modal" hidden><div class="modal-bg" data-close></div><div class="sheet" id="sheet"></div></div>
<script src="app.js"></script>
</body>
</html>
